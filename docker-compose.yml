version: '3.8'

services:
  framepack:
    build:
      context: .
      dockerfile: Dockerfile
    image: framepack:latest
    container_name: framepack
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    ports:
      - "7860:7860"
    volumes:
      - ./outputs:/app/outputs
    restart: unless-stopped
    shm_size: '2gb' 